services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: fundrise_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fundrise
      POSTGRES_PASSWORD: fundrise_pass
      POSTGRES_DB: fundrise
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fundrise -d fundrise"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Full-Stack Application (Backend + Frontend SPA)
  app:
    build: .
    container_name: fundrise_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://fundrise:fundrise_pass@db:5432/fundrise
      - JWT_SECRET=fundrise_jwt_secret_key_change_this_in_production
      - AUTO_SEED=true
    ports:
      - "5001:5000"

volumes:
  postgres_data: