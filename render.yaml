# Render Blueprint - FundRise Platform
databases:
  - name: fundrise-db
    databaseName: fundrise
    user: fundrise
    plan: free

services:
  - type: web
    name: fundrise-web
    env: node
    plan: free
    buildCommand: npm run postinstall && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fundrise-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: BCRYPT_SALT_ROUNDS
        value: "10"
      - key: PORT
        value: "10000"